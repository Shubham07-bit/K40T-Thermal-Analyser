# Bitbucket Pipelines builds the Linux x86_64 binary.
# Windows MSVC builds remain on GitHub Actions because the bundled
# blstsdk64.lib is an MSVC static library and is not compatible with MinGW.
pipelines:
  default:
    - step:
        name: Build Linux x86_64
        script:
          - sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev libgl-dev libvulkan-dev file
          - qt-cmake . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          - cmake --build build --config Release -j$(nproc)
          - mkdir -p deploy
          - cp build/thermal_analyzer deploy/thermal_analyzer
          - chmod +x deploy/thermal_analyzer
          - tar -czvf thermal_analyzer-linux-x86_64.tar.gz -C deploy thermal_analyzer
        artifacts:
          - thermal_analyzer-linux-x86_64.tar.gz
  branches:
    master:
      - step:
          name: Build Linux x86_64
          script:
            - sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev libgl-dev libvulkan-dev file
            - qt-cmake . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            - cmake --build build --config Release -j$(nproc)
            - mkdir -p deploy
            - cp build/thermal_analyzer deploy/thermal_analyzer
            - chmod +x deploy/thermal_analyzer
            - tar -czvf thermal_analyzer-linux-x86_64.tar.gz -C deploy thermal_analyzer
          artifacts:
            - thermal_analyzer-linux-x86_64.tar.gz
